<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Landing Page</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px;
    min-height: 100vh;
    background: #080b18;
    font-family: Arial, sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* VIDEO FRAME */
.video-card {
    position: relative;

    width: 100%;
    max-width: 900px;

    aspect-ratio: 16 / 9;

    border-radius: 24px;

    overflow: hidden;

    cursor: pointer;

    /* IMAGE */
    background-image: url("./cov/cover1.png");

    background-repeat: no-repeat;
    background-size: cover;
    background-position: center center;

    border: 2px solid rgba(255,255,255,0.2);

    box-shadow:
        0 30px 80px rgba(0,0,0,0.7),
        0 0 60px rgba(124,58,237,0.25);

    transition: 0.3s ease;
}

/* HOVER */
.video-card:hover {
    transform: scale(1.02);
}

/* DARK OVERLAY */
.video-card::before {
    content: "";

    position: absolute;

    left: 0;
    top: 0;
    right: 0;
    bottom: 0;

    background: rgba(0,0,0,0.30);

    z-index: 1;
}

/* CONTENT */
.video-content {
    position: absolute;

    left: 0;
    top: 0;
    right: 0;
    bottom: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    z-index: 2;
}

/* PLAY BUTTON */
.play-button {
    width: 90px;
    height: 90px;

    border-radius: 50%;

    background: #ffffff;

    display: flex;

    align-items: center;
    justify-content: center;

    box-shadow:
        0 10px 40px rgba(0,0,0,0.6);

    transition: 0.3s ease;
}

.video-card:hover .play-button {
    transform: scale(1.12);
}

/* PLAY ICON */
.play-icon {
    width: 0;
    height: 0;

    border-top: 15px solid transparent;
    border-bottom: 15px solid transparent;

    border-left: 23px solid #6d28d9;

    margin-left: 6px;
}

/* TEXT */
.watch-text {
    margin-top: 18px;

    color: white;

    font-size: 20px;

    font-weight: bold;

    text-shadow:
        0 2px 10px rgba(0,0,0,0.8);
}

</style>
</head>


<body>


<div class="video-card" onclick="openMainPage()">

    <div class="video-content">

        <div class="play-button">
            <div class="play-icon"></div>
        </div>

        <div class="watch-text">
            Click to Watch
        </div>

    </div>

</div>


<script>

function openMainPage() {

    window.open(
        "https://example.com/",
        "_blank"
    );

}

</script>


</body>
</html>
