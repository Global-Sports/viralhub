<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Video</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #312e81 0%, transparent 35%),
        radial-gradient(circle at bottom right, #7c3aed 0%, transparent 35%),
        #080b18;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 14px;
      color: #c4b5fd;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: clamp(32px, 6vw, 62px);
      line-height: 1.05;
      margin-bottom: 15px;
      font-weight: 800;
    }

    .subtitle {
      color: #b8bdd0;
      font-size: 18px;
      max-width: 600px;
      margin: 0 auto 35px;
      line-height: 1.6;
    }

    /* Video Card */
    .video-card {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 24px;
      overflow: hidden;
      cursor: pointer;
      background:
        linear-gradient(135deg, #18122d, #111827);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow:
        0 30px 80px rgba(0,0,0,0.5),
        0 0 60px rgba(124,58,237,0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .video-card:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow:
        0 40px 100px rgba(0,0,0,0.6),
        0 0 80px rgba(124,58,237,0.35);
    }

    .video-bg {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          135deg,
          rgba(124,58,237,0.5),
          rgba(37,99,235,0.3)
        );
    }

    /* Decorative circles */
    .circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.5;
    }

    .circle.one {
      width: 250px;
      height: 250px;
      background: #7c3aed;
      top: -100px;
      left: -70px;
    }

    .circle.two {
      width: 300px;
      height: 300px;
      background: #2563eb;
      right: -100px;
      bottom: -120px;
    }

    .video-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      background: rgba(0,0,0,0.25);
    }

    /* Play Button */
    .play-button {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      transition: 0.3s ease;
      animation: pulse 2s infinite;
    }

    .video-card:hover .play-button {
      transform: scale(1.12);
      background: #f5f3ff;
    }

    .play-icon {
      width: 0;
      height: 0;
      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
      border-left: 20px solid #6d28d9;
      margin-left: 6px;
    }

    .watch-text {
      margin-top: 20px;
      font-size: 18px;
      font-weight: 600;
    }

    .duration {
      position: absolute;
      right: 20px;
      bottom: 20px;
      background: rgba(0,0,0,0.7);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      backdrop-filter: blur(8px);
    }

    .bottom-text {
      margin-top: 25px;
      color: #8f96aa;
      font-size: 14px;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(255,255,255,0.35);
      }
      70% {
        box-shadow: 0 0 0 20px rgba(255,255,255,0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(255,255,255,0);
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 15px;
      }

      .video-card {
        border-radius: 16px;
      }

      .play-button {
        width: 70px;
        height: 70px;
      }

      .watch-text {
        font-size: 15px;
      }

      .duration {
        right: 12px;
        bottom: 12px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="badge">▶ Featured Video</div>

    <h1>Watch The Video</h1>

    <p class="subtitle">
      Discover something amazing. Click the video below to continue.
    </p>

    <!-- CLICK HERE TO OPEN YOUR MAIN LANDING PAGE -->
    <div
      class="video-card"
      onclick="openMainPage()"
      role="button"
      tabindex="0"
    >

      <div class="video-bg"></div>

      <div class="circle one"></div>
      <div class="circle two"></div>

      <div class="video-content">

        <div class="play-button">
          <div class="play-icon"></div>
        </div>

        <div class="watch-text">
          Click to Watch
        </div>

      </div>

      <div class="duration">
        12:45
      </div>

    </div>

    <p class="bottom-text">
      Click the video to open the full page in a new tab.
    </p>

  </main>


  <script>

    function openMainPage() {

      // CHANGE THIS TO YOUR MAIN LANDING PAGE URL
      const mainPage = "https://viralvideoshub.xyz/?test";

      window.open(mainPage, "_blank");

    }

  </script>

</body>
</html>
