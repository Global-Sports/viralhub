<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Video</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px;
    min-height: 100vh;
    background: #080b18;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
}

.video-wrapper {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
}

.video-card {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 24px;
    overflow: hidden;
    cursor: pointer;

    /* JS এখানে random image বসাবে */
    background-image: url("./cov/hero1.jpg");

    background-repeat: no-repeat;
    background-size: cover;
    background-position: center center;

    border: 2px solid rgba(255,255,255,0.2);
    box-shadow:
        0 30px 80px rgba(0,0,0,0.7),
        0 0 60px rgba(124,58,237,0.25);

    transition: 0.3s ease;
}

.video-card:hover {
    transform: scale(1.02);
}

.video-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.30);
    z-index: 1;
}

.video-content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 2;
}

.play-button {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    transition: 0.3s ease;
}

.video-card:hover .play-button {
    transform: scale(1.12);
}

.play-icon {
    width: 0;
    height: 0;
    border-top: 15px solid transparent;
    border-bottom: 15px solid transparent;
    border-left: 23px solid #6d28d9;
    margin-left: 6px;
}

.watch-text {
    margin-top: 18px;
    color: white;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
}

.ad-container {
    width: 100%;
    min-height: 90px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    position: relative;
    overflow: visible;
}

@media (max-width: 600px) {
    body {
        padding: 15px;
    }

    .video-wrapper {
        gap: 15px;
    }

    .video-card {
        border-radius: 16px;
    }

    .play-button {
        width: 70px;
        height: 70px;
    }

    .play-icon {
        border-top-width: 12px;
        border-bottom-width: 12px;
        border-left-width: 19px;
    }

    .watch-text {
        font-size: 16px;
        margin-top: 12px;
    }
}
</style>
</head>

            <div class="watch-text">
                Click to Watch

    </div>


    <!-- AD BELOW VIDEO -->
